plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'autocraft'
}

loom {
	runs {
		// dev only: ./gradlew runHarness opens run/saves/test with DevHarness on (commands from run/harness-in.txt)
		harness {
			inherit client
			configName = "Harness"
			vmArg "-Dautocraft.harness=true"
			programArgs "--quickPlaySingleplayer", "test", "--username", "DevBot"
		}
		// a second one alongside (own game folder run2/, world "edge", smaller heap), for testing two jobs at once
		harness2 {
			inherit client
			configName = "Harness 2"
			runDir "run2"
			vmArgs "-Dautocraft.harness=true", "-Xmx3G"
			programArgs "--quickPlaySingleplayer", "edge", "--username", "DevBot"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
